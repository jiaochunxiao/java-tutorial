<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
  :root { --ink:#1E293B; --sub:#475569; --line:#E2E8F0; --brand:#2563EB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
         color: var(--ink); background: #F8FAFC; }
  a { color: var(--brand); text-decoration: none; }

  aside { position: fixed; top: 0; left: 0; bottom: 0; width: 292px; overflow-y: auto;
          background: #0F172A; color: #CBD5E1; padding: 20px 14px 32px; }
  .brand { font-size: 17px; font-weight: 700; color: #F8FAFC; padding: 6px 10px 14px;
           border-bottom: 1px solid #1E293B; margin-bottom: 12px; }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: #64748B; margin-top: 4px; }
  #search { width: 100%; margin: 10px 0 4px; padding: 7px 10px; border-radius: 8px; font-size: 12px;
            border: 1px solid #1E293B; background: #1E293B; color: #E2E8F0; outline: none; }
  #search:focus { border-color: #3B82F6; }
  .nav-home { display: block; margin: 6px 0; padding: 9px 10px; border-radius: 8px;
              color: #E2E8F0; font-weight: 600; font-size: 13.5px; }
  .sec { margin: 16px 4px 6px; font-size: 12px; font-weight: 700; color: var(--c, #94A3B8); }
  a.item { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 8px;
           color: #CBD5E1; font-size: 12.5px; line-height: 1.5; }
  a.item:hover { background: #1E293B; color: #F8FAFC; }
  a.item.active { background: #1D4ED8; color: #FFFFFF; font-weight: 600; }
  a.item .no { color: #64748B; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  a.item.active .no { color: #BFDBFE; }

  main { margin-left: 292px; padding: 40px 48px 80px; }
  article { max-width: 880px; margin: 0 auto; background: #FFFFFF; border: 1px solid var(--line);
            border-radius: 16px; padding: 44px 52px 40px; line-height: 1.85; font-size: 15.5px; }
  article h1 { font-size: 27px; line-height: 1.4; border-bottom: 2px solid var(--line); padding-bottom: 14px; }
  article h2 { font-size: 21px; margin-top: 42px; padding-left: 12px; border-left: 4px solid var(--brand); }
  article h3 { font-size: 17.5px; margin-top: 30px; }
  article p { margin: 14px 0; }
  article img { max-width: 100%; display: block; margin: 22px auto; border: 1px solid var(--line);
                border-radius: 12px; box-shadow: 0 6px 20px rgba(15,23,42,.06); }
  article table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 13.5px; }
  article th, article td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  article th { background: #F1F5F9; }
  article tr:nth-child(even) td { background: #FAFBFD; }
  article code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .88em;
                 background: #EEF2F7; padding: 2px 6px; border-radius: 5px; }
  article pre { background: #0D1117; border-radius: 12px; padding: 18px 20px; overflow-x: auto; }
  article pre code { background: none; padding: 0; color: #E6EDF3; font-size: 13px; line-height: 1.6; }
  article ul, article ol { padding-left: 26px; }
  article li { margin: 6px 0; }
  article hr { border: none; border-top: 1px dashed var(--line); margin: 34px 0; }

  blockquote { margin: 18px 0; padding: 12px 18px; border-radius: 10px;
               border-left: 4px solid #94A3B8; background: #F8FAFC; color: var(--sub); }
  blockquote p { margin: 6px 0; }
  blockquote.tip-key   { border-color: #2563EB; background: #EFF6FF; }
  blockquote.tip-warn  { border-color: #DC2626; background: #FEF2F2; }
  blockquote.tip-expert{ border-color: #7C3AED; background: #F5F3FF; }
  blockquote.tip-fig   { border-color: #64748B; background: #F1F5F9; font-size: 14px; }
  .mermaid { background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px;
             padding: 18px; margin: 20px 0; overflow-x: auto; text-align: center; }

  .crumb { max-width: 880px; margin: 0 auto 14px; font-size: 13px; color: #64748B; }
  .pnbar { max-width: 880px; margin: 22px auto 0; display: flex; gap: 14px; }
  a.pn { flex: 1; border: 1px solid var(--line); background: #FFFFFF; border-radius: 12px;
         padding: 12px 16px; color: var(--ink); font-size: 13px; }
  a.pn:hover { border-color: var(--brand); }
  a.pn span { display: block; color: #94A3B8; font-size: 11.5px; margin-bottom: 4px; }
  a.pn.ghost { visibility: hidden; }

  footer.site { max-width: 880px; margin: 26px auto 0; font-size: 12px; color: #94A3B8; text-align: center; }
  @media (max-width: 960px) {
    aside { position: static; width: auto; }
    main { margin-left: 0; padding: 24px 16px 60px; }
    article { padding: 26px 20px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">☕ Java 从零到专家<small>36 篇 · 五个阶段 · 从 Hello World 到架构师</small></div>
  <input id="search" type="text" placeholder="🔍 搜索文章标题…">
  <nav id="nav">
{{SIDEBAR}}
  </nav>
</aside>
<main>
  <div class="crumb">📖 Java 从零到专家 · 博客系列{{CRUMB_EXTRA}}</div>
  <article>
{{BODY}}
  </article>
{{PREVNEXT}}
  <footer class="site">由 Markdown 静态构建生成 · 源文件见 java-blog-series/ · 图表支持 mermaid</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
  if (window.mermaid) mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
  if (window.hljs) hljs.highlightAll();
  var box = document.getElementById('search');
  box.addEventListener('input', function () {
    var q = box.value.trim().toLowerCase();
    document.querySelectorAll('#nav a.item, #nav .sec').forEach(function (el) {
      el.style.display = (!q || (el.textContent || '').toLowerCase().includes(q)) ? '' : 'none';
    });
  });
</script>
</body>
</html>
