<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">BIO vs NIO：一个服务员管一桌，还是一个总管管全场？</text>

  <!-- BIO -->
  <rect x="46" y="66" width="380" height="330" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="236" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">BIO：一连接一线程（Blocking IO）</text>
  <g text-anchor="middle">
    <rect x="70" y="112" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="145" y="136" font-size="12" fill="#991B1B">线程 1</text>
    <text x="145" y="158" font-size="11" fill="#475569">死守 1 号桌 read() 等</text>
    <rect x="70" y="196" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="145" y="220" font-size="12" fill="#991B1B">线程 2</text>
    <text x="145" y="242" font-size="11" fill="#475569">死守 2 号桌 read() 等</text>
    <rect x="70" y="280" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="145" y="304" font-size="12" fill="#991B1B">线程 3</text>
    <text x="145" y="326" font-size="11" fill="#475569">死守 3 号桌 read() 等</text>
  </g>
  <g text-anchor="middle">
    <rect x="250" y="112" width="150" height="70" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="325" y="140" font-size="12" fill="#64748B">1 号桌客人</text>
    <text x="325" y="160" font-size="11" fill="#94A3B8">光聊天不点菜</text>
    <rect x="250" y="196" width="150" height="70" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="325" y="224" font-size="12" fill="#64748B">2 号桌客人</text>
    <text x="325" y="244" font-size="11" fill="#94A3B8">还没想好吃啥</text>
    <rect x="250" y="280" width="150" height="70" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="325" y="308" font-size="12" fill="#64748B">4~10000 号桌</text>
    <text x="325" y="328" font-size="11" fill="#94A3B8">还得再雇 9997 个服务员?</text>
  </g>
  <text x="236" y="378" text-anchor="middle" font-size="11" fill="#B91C1C">等待也占线程 → C10K 问题的根源</text>

  <!-- NIO -->
  <rect x="460" y="66" width="360" height="330" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="640" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">NIO：一个线程管全部（事件驱动）</text>
  <rect x="500" y="112" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="640" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Selector 总管（1 个线程）</text>
  <text x="640" y="158" text-anchor="middle" font-size="11" fill="#065F46">select() 盯着事件板：谁就绪叫谁</text>
  <g text-anchor="middle" font-size="11">
    <rect x="500" y="188" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="543" y="210" fill="#065F46">通道 1</text><text x="543" y="228" fill="#059669" font-weight="700">可读 ★</text>
    <rect x="596" y="188" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="639" y="210" fill="#065F46">通道 2</text><text x="639" y="228" fill="#94A3B8">安静中</text>
    <rect x="692" y="188" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="735" y="210" fill="#065F46">通道 3</text><text x="735" y="228" fill="#059669" font-weight="700">可写 ★</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <rect x="500" y="256" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="543" y="278" fill="#065F46">通道 4</text><text x="543" y="296" fill="#94A3B8">安静中</text>
    <rect x="596" y="256" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="639" y="278" fill="#065F46">通道 5</text><text x="639" y="296" fill="#94A3B8">安静中</text>
    <rect x="692" y="256" width="86" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="735" y="278" fill="#065F46">……</text><text x="735" y="296" fill="#94A3B8">上千个</text>
  </g>
  <line x1="640" y1="244" x2="560" y2="222" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="640" y1="244" x2="718" y2="222" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="640" y="336" text-anchor="middle" font-size="11" fill="#047852">线程数与连接数解耦：1 个线程扛上千连接</text>
  <text x="640" y="356" text-anchor="middle" font-size="11" fill="#047852">底层靠 OS 多路复用（Linux = epoll）</text>
  <text x="640" y="380" text-anchor="middle" font-size="11" fill="#64748B">Netty = 工业级 NIO 封装（修 bug + 好 API）</text>

  <text x="430" y="424" text-anchor="middle" font-size="12" fill="#64748B">适用提醒：连接少、请求快的内部系统，BIO 反而简单可靠——技术选型没有鄙视链。</text>
</svg>
