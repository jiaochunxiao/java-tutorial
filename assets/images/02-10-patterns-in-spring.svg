<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <rect width="860" height="440" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">设计模式在 Spring 容器里的"出场位置"</text>

  <!-- central container -->
  <rect x="280" y="160" width="300" height="120" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">Spring IoC 容器</text>
  <text x="430" y="226" text-anchor="middle" font-size="12" fill="#475569">BeanDefinitionMap → 单例池</text>
  <text x="430" y="248" text-anchor="middle" font-size="12" fill="#475569">（设计模式的"主战场"）</text>

  <!-- six pattern stations -->
  <g text-anchor="middle">
    <rect x="46" y="70" width="200" height="72" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="146" y="96" font-size="14" font-weight="700" fill="#047857">单例模式</text>
    <text x="146" y="118" font-size="11" fill="#475569">默认 scope=singleton</text>
    <text x="146" y="134" font-size="11" fill="#64748B">容器级单例，非类加载器级</text>

    <rect x="614" y="70" width="200" height="72" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="714" y="96" font-size="14" font-weight="700" fill="#B45309">工厂模式</text>
    <text x="714" y="118" font-size="11" fill="#92400E">FactoryBean.getObject()</text>
    <text x="714" y="134" font-size="11" fill="#64748B">MyBatis Mapper 靠它凭空造代理</text>

    <rect x="46" y="170" width="200" height="100" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="146" y="196" font-size="14" font-weight="700" fill="#6D28D9">代理模式 ★C位</text>
    <text x="146" y="218" font-size="11" fill="#5B21B6">@Transactional / @Async / @Cacheable</text>
    <text x="146" y="236" font-size="11" fill="#5B21B6">AnnotationAwareAspectJAuto-</text>
    <text x="146" y="252" font-size="11" fill="#5B21B6">ProxyCreator 初始化后偷梁换柱</text>

    <rect x="614" y="170" width="200" height="100" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="714" y="196" font-size="14" font-weight="700" fill="#047857">模板方法</text>
    <text x="714" y="218" font-size="11" fill="#475569">JdbcTemplate：流程父类包办</text>
    <text x="714" y="236" font-size="11" fill="#475569">AQS：acquire 定流程</text>
    <text x="714" y="254" font-size="11" fill="#475569">refresh()：十二步总装</text>

    <rect x="46" y="300" width="200" height="100" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
    <text x="146" y="326" font-size="14" font-weight="700" fill="#BE185D">责任链</text>
    <text x="146" y="348" font-size="11" fill="#9D174D">Servlet Filter → Interceptor</text>
    <text x="146" y="366" font-size="11" fill="#9D174D">AOP 拦截器链（Method-</text>
    <text x="146" y="384" font-size="11" fill="#9D174D">Invocation.proceed()）</text>

    <rect x="614" y="300" width="200" height="100" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="714" y="326" font-size="14" font-weight="700" fill="#9A3412">观察者</text>
    <text x="714" y="348" font-size="11" fill="#92400E">ApplicationEvent 发布订阅</text>
    <text x="714" y="366" font-size="11" fill="#92400E">启动事件贯穿 SpringApplication</text>
    <text x="714" y="384" font-size="11" fill="#92400E">MQ = 分布式版观察者</text>
  </g>

  <!-- connectors -->
  <g stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4">
    <line x1="246" y1="106" x2="278" y2="170"/>
    <line x1="614" y1="106" x2="582" y2="170"/>
    <line x1="246" y1="220" x2="278" y2="220"/>
    <line x1="614" y1="220" x2="582" y2="220"/>
    <line x1="246" y1="350" x2="278" y2="280"/>
    <line x1="614" y1="350" x2="582" y2="280"/>
  </g>

  <rect x="280" y="300" width="300" height="100" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="430" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">策略模式也在场</text>
  <text x="430" y="348" text-anchor="middle" font-size="11" fill="#475569">Resource 接口的多实现、AopProxy 的</text>
  <text x="430" y="366" text-anchor="middle" font-size="11" fill="#475569">JDK/CGLIB 两种创建策略、初始化方式</text>
  <text x="430" y="384" text-anchor="middle" font-size="11" fill="#475569">读源码时遇到"一个接口一堆实现"就想策略</text>

  <text x="430" y="424" text-anchor="middle" font-size="12" fill="#64748B">学模式别背书：在框架源码里认出它们一次，胜过背书十遍。</text>
</svg>
