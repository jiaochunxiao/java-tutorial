<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">类型擦除：泛型只活在编译期</text>
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#64748B">编译器当安检员，检完就把安检门拆了（List&lt;String&gt; 运行时只是 List）</text>

  <!-- compile time -->
  <rect x="50" y="84" width="360" height="250" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">编译期：安检员在岗</text>
  <g font-size="13" text-anchor="middle">
    <rect x="90" y="132" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="230" y="156" font-family="monospace" fill="#1E40AF">List&lt;String&gt; list</text>
    <rect x="90" y="184" width="130" height="40" rx="8" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="155" y="209" fill="#047857">add("hi") ✅</text>
    <rect x="240" y="184" width="130" height="40" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="305" y="209" fill="#B91C1C">add(42) ❌ 编译报错</text>
    <text x="230" y="258" font-size="12" fill="#475569">强转消失：get(0) 自动是 String，</text>
    <text x="230" y="278" font-size="12" fill="#475569">不需要 (String) list.get(0)</text>
    <text x="230" y="308" font-size="12" fill="#1E40AF" font-weight="700">类型信息写在代码里给编译器看</text>
  </g>

  <line x1="416" y1="200" x2="452" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="434" y="182" text-anchor="middle" font-size="11" fill="#475569">javac</text>
  <text x="434" y="224" text-anchor="middle" font-size="11" fill="#475569">擦除 T→Object</text>

  <!-- runtime -->
  <rect x="460" y="84" width="360" height="250" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">运行时：都是原始类型 List</text>
  <g font-size="13" text-anchor="middle">
    <rect x="500" y="132" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="640" y="156" font-family="monospace" fill="#B91C1C">List（元素全是 Object）</text>
    <rect x="500" y="184" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="640" y="208" fill="#B91C1C">getClass() == 同一个 Class 对象</text>
    <text x="640" y="230" font-size="12" fill="#475569">List&lt;String&gt; 和 List&lt;Integer&gt; 是一个类</text>
    <rect x="500" y="264" width="280" height="52" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="640" y="286" fill="#9A3412">反射能塞进 Integer（安检员下班了）</text>
    <text x="640" y="306" font-size="11" fill="#64748B">框架的"后门"，也是灵活性来源</text>
  </g>

  <rect x="50" y="348" width="770" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="66" y="367" font-size="13" fill="#475569">擦除规则：无界参数 T → Object；有界参数 T extends Number → Number。</text>
  <text x="66" y="387" font-size="13" fill="#475569">例外：类继承体系上的泛型签名保留在字节码中（getGenericSuperclass 可读，框架泛型反序列化的钥匙）。</text>
</svg>
