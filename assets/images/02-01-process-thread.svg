<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">进程 vs 线程：厂房与工人</text>

  <!-- process big box -->
  <rect x="60" y="70" width="560" height="330" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="340" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">进程（Process）：操作系统分配资源的"厂房"</text>

  <!-- shared area -->
  <rect x="90" y="120" width="500" height="110" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="340" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">共享区（所有线程共用）</text>
  <g font-size="12" text-anchor="middle" fill="#92400E">
    <rect x="110" y="160" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="180" y="180">堆 Heap</text>
    <text x="180" y="198" font-size="11" fill="#B45309">对象都住这 ★</text>
    <rect x="270" y="160" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="340" y="180">方法区 / 元空间</text>
    <text x="340" y="198" font-size="11" fill="#B45309">类信息、静态变量</text>
    <rect x="430" y="160" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="500" y="180">文件 / 网络 / Socket</text>
    <text x="500" y="198" font-size="11" fill="#B45309">打开的资源</text>
  </g>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="#B45309">⚠️ 共享是效率，也是危险的来源：多个线程改同一个对象 = 竞态条件</text>

  <!-- threads -->
  <g>
    <g transform="translate(110,272)">
      <rect width="140" height="110" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
      <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">线程 1（main）</text>
      <rect x="14" y="36" width="112" height="30" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="56" text-anchor="middle" font-size="11" fill="#065F46">私有栈（方法调用）</text>
      <rect x="14" y="72" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="90" text-anchor="middle" font-size="11" fill="#065F46">程序计数器 PC</text>
    </g>
    <g transform="translate(270,272)">
      <rect width="140" height="110" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
      <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">线程 2（worker）</text>
      <rect x="14" y="36" width="112" height="30" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="56" text-anchor="middle" font-size="11" fill="#065F46">私有栈（方法调用）</text>
      <rect x="14" y="72" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="90" text-anchor="middle" font-size="11" fill="#065F46">程序计数器 PC</text>
    </g>
    <g transform="translate(430,272)">
      <rect width="140" height="110" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
      <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">线程 3（GC）</text>
      <rect x="14" y="36" width="112" height="30" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="56" text-anchor="middle" font-size="11" fill="#065F46">私有栈（方法调用）</text>
      <rect x="14" y="72" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
      <text x="70" y="90" text-anchor="middle" font-size="11" fill="#065F46">程序计数器 PC</text>
    </g>
  </g>

  <!-- right notes -->
  <g font-size="12" fill="#334155">
    <rect x="648" y="84" width="184" height="300" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="664" y="110" font-weight="700" fill="#1E293B">对比速记</text>
    <text x="664" y="138">进程：资源分配单位</text>
    <text x="664" y="158">线程：调度执行单位</text>
    <text x="664" y="192">通信成本：</text>
    <text x="664" y="212">进程要 IPC（贵）</text>
    <text x="664" y="232">线程读写共享变量（快但危险）</text>
    <text x="664" y="266">崩溃影响：</text>
    <text x="664" y="286">进程隔离互不波及</text>
    <text x="664" y="306">一个线程 OOM 全进程陪葬</text>
    <text x="664" y="340">Java 程序天生多线程：</text>
    <text x="664" y="360">main + GC + JIT……</text>
    <text x="664" y="380">你不写并发，JVM 也在并发</text>
  </g>
</svg>
