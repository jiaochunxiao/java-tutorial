<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="300" rx="16" fill="url(#bg)"/>
  <text x="430" y="66" text-anchor="middle" font-size="34" font-weight="700" fill="#1E293B">Java 从零到专家 · 博客系列</text>
  <text x="430" y="98" text-anchor="middle" font-size="15" fill="#475569">36 篇详细教程 · 五个阶段 · 一条不绕路的学习路线</text>

  <!-- coffee cup -->
  <g transform="translate(84,52)">
    <path d="M0,8 h44 v22 a14,14 0 0 1 -14,14 h-16 a14,14 0 0 1 -14,-14 z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <path d="M44,14 h8 a8,8 0 0 1 0,16 h-8" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M12,-6 q4,-6 0,-12 M24,-6 q4,-6 0,-12" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="52" text-anchor="middle" font-size="11" fill="#64748B">Hello World</text>
  </g>

  <!-- five stage chips -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="70"  y="168" width="132" height="52" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="136" y="190" fill="#1D4ED8">① 基础篇</text>
    <text x="136" y="210" font-size="12" font-weight="400" fill="#475569">10 篇</text>

    <line x1="204" y1="194" x2="228" y2="194" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="232" y="168" width="132" height="52" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="298" y="190" fill="#047857">② 进阶篇</text>
    <text x="298" y="210" font-size="12" font-weight="400" fill="#475569">并发 / JVM</text>

    <line x1="366" y1="194" x2="390" y2="194" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="394" y="168" width="140" height="52" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="464" y="190" fill="#B45309">③ 原理篇</text>
    <text x="464" y="210" font-size="12" font-weight="400" fill="#475569">Spring Boot</text>

    <line x1="536" y1="194" x2="560" y2="194" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="564" y="168" width="132" height="52" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
    <text x="630" y="190" fill="#BE185D">④ 实践篇</text>
    <text x="630" y="210" font-size="12" font-weight="400" fill="#475569">生产级项目</text>

    <line x1="698" y1="194" x2="722" y2="194" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="726" y="168" width="108" height="52" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="780" y="190" fill="#6D28D9">⑤ 高手篇</text>
    <text x="780" y="210" font-size="12" font-weight="400" fill="#475569">架构思维</text>
  </g>
  <text x="430" y="266" text-anchor="middle" font-size="13" fill="#64748B">语法入门 → 并发 / JVM → 框架祛魅 → 工程落地 → 架构与成长</text>
</svg>
