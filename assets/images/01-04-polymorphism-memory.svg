<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">多态的运行时秘密：引用看左边，干活看右边</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#475569" font-family="monospace">Animal a = new Dog();   a.sound();  →  输出：汪汪！</text>

  <!-- stack -->
  <rect x="70" y="92" width="230" height="170" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="185" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">栈 · 引用变量 a</text>
  <rect x="100" y="140" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="112" y="160" font-size="13" fill="#1E293B">编译期类型：</text>
  <text x="112" y="178" font-size="14" font-weight="700" fill="#1D4ED8">Animal（看左边）</text>
  <text x="185" y="216" text-anchor="middle" font-size="11" fill="#475569">决定"能调用哪些方法"</text>
  <text x="185" y="234" text-anchor="middle" font-size="11" fill="#475569">（只能调 Animal 声明的）</text>

  <line x1="306" y1="163" x2="380" y2="163" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="343" y="150" text-anchor="middle" font-size="11" fill="#475569">指向</text>

  <!-- heap object -->
  <rect x="390" y="92" width="270" height="230" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="525" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">堆 · Dog 对象（运行时类型）</text>
  <rect x="414" y="138" width="222" height="40" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="426" y="163" font-size="13" fill="#1E293B">字段：legs = 4，bark = "汪"</text>
  <!-- method table -->
  <rect x="414" y="192" width="222" height="112" rx="8" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="525" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">方法表（虚方法表 vtable）</text>
  <text x="430" y="238" font-size="13" fill="#92400E">sound()</text>
  <text x="525" y="238" font-size="13" font-weight="700" fill="#DC2626">→ Dog 的实现 ★</text>
  <text x="430" y="262" font-size="13" fill="#92400E">eat()</text>
  <text x="525" y="262" font-size="13" fill="#475569">→ 继承 Animal 的</text>
  <text x="430" y="286" font-size="13" fill="#92400E">toString()</text>
  <text x="525" y="286" font-size="13" fill="#475569">→ 继承 Object 的</text>

  <!-- runtime binding -->
  <rect x="690" y="92" width="150" height="230" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="765" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">动态绑定</text>
  <text x="765" y="144" text-anchor="middle" font-size="12" fill="#475569">JVM 运行时</text>
  <text x="765" y="164" text-anchor="middle" font-size="12" fill="#475569">按对象实际类型</text>
  <text x="765" y="184" text-anchor="middle" font-size="12" fill="#475569">查方法表调用</text>
  <line x1="690" y1="215" x2="666" y2="215" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="765" y="240" text-anchor="middle" font-size="12" fill="#6D28D9" font-weight="700">运行时类型才决定</text>
  <text x="765" y="260" text-anchor="middle" font-size="12" fill="#6D28D9" font-weight="700">"方法到底是谁的"</text>
  <text x="765" y="300" text-anchor="middle" font-size="12" fill="#475569">↓ 换成 new Cat()</text>
  <text x="765" y="318" text-anchor="middle" font-size="12" fill="#475569">同一行代码自动变成</text>
  <text x="765" y="336" text-anchor="middle" font-size="12" fill="#475569">"喵喵！"——扩展不改码</text>

  <rect x="70" y="344" width="770" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="86" y="369" font-size="13" fill="#475569">一句话：编译看左边（能不能调），运行看右边（实际执行谁）。这是"开闭原则"的底层支点——新增子类，老代码一行不改。</text>
</svg>
