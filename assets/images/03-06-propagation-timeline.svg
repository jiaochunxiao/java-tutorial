<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">三大传播行为：事务怎么"接力"（时间条块图）</text>
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#64748B">外层方法 A 调用内层方法 B；横条 = 物理事务（数据库连接）的范围</text>

  <!-- REQUIRED -->
  <text x="66" y="102" font-size="14" font-weight="700" fill="#1D4ED8">REQUIRED（默认）</text>
  <rect x="66" y="112" width="620" height="34" rx="8" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="86" y="134" font-size="12" fill="#1E3A8A">A 的事务（一条物理事务/连接）</text>
  <rect x="300" y="112" width="200" height="34" rx="8" fill="#2563EB" opacity="0.35"/>
  <text x="400" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">B 加入同一事务</text>
  <text x="700" y="134" font-size="12" fill="#475569">一起提交/一起回滚（绑死）</text>

  <!-- REQUIRES_NEW -->
  <text x="66" y="182" font-size="14" font-weight="700" fill="#047857">REQUIRES_NEW</text>
  <rect x="66" y="192" width="620" height="34" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="86" y="214" font-size="12" fill="#065F46">A 的事务（挂起等待）</text>
  <rect x="330" y="178" width="230" height="34" rx="8" fill="#059669" opacity="0.85"/>
  <text x="445" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">B 的独立事务（新连接）</text>
  <text x="700" y="214" font-size="12" fill="#475569">B 先提交；A 回滚不连累 B</text>
  <text x="700" y="232" font-size="11" fill="#047857">→ 错误日志场景标配</text>

  <!-- NESTED -->
  <text x="66" y="262" font-size="14" font-weight="700" fill="#B45309">NESTED</text>
  <rect x="66" y="272" width="620" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="86" y="294" font-size="12" fill="#92400E">A 的事务</text>
  <rect x="330" y="272" width="200" height="34" rx="8" fill="#F59E0B" opacity="0.45"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">B = 保存点 SAVEPOINT</text>
  <text x="700" y="294" font-size="12" fill="#475569">B 可局部回滚到保存点；</text>
  <text x="700" y="312" font-size="12" fill="#B45309">A 回滚则 B 必死</text>

  <!-- legend -->
  <rect x="66" y="330" width="760" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="82" y="354" font-size="12" font-weight="700" fill="#1E293B">选型口诀：</text>
  <text x="82" y="376" font-size="12" fill="#475569">绝大多数用 REQUIRED（默认）；"失败也要留痕"用 REQUIRES_NEW（独立连接、真正隔离）；</text>
  <text x="82" y="392" font-size="12" fill="#475569">批量导入"坏一条不坏一批"用 NESTED（同连接、靠保存点）。⚠️ 内层换传播行为必须走代理调用，this 调用照样失效。</text>
</svg>
