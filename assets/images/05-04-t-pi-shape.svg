<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <rect width="860" height="400" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">T 型 → π 型：深度给话语权，广度给选择权</text>

  <!-- T shape -->
  <rect x="60" y="70" width="340" height="280" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">T 型（进阶期目标）</text>
  <!-- horizontal bar -->
  <rect x="110" y="130" width="240" height="26" rx="6" fill="#93C5FD"/>
  <text x="230" y="148" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="700">广度：懂多领域（一横）</text>
  <!-- vertical bar -->
  <rect x="212" y="164" width="36" height="150" rx="6" fill="#2563EB"/>
  <text x="280" y="200" text-anchor="start" font-size="11" fill="#1E40AF">深度：</text>
  <text x="280" y="218" text-anchor="start" font-size="11" fill="#1E40AF">一个领域钻透</text>
  <text x="280" y="236" text-anchor="start" font-size="11" fill="#1E40AF">（一竖 = 话语权）</text>
  <text x="230" y="336" text-anchor="middle" font-size="11" fill="#475569">例：业务扎实 + 把"消息可靠性"吃到底</text>

  <!-- π shape -->
  <rect x="460" y="70" width="340" height="280" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">π 型（高手期目标）</text>
  <rect x="510" y="130" width="240" height="26" rx="6" fill="#6EE7B7"/>
  <text x="630" y="148" text-anchor="middle" font-size="11" fill="#065F46" font-weight="700">广度：跨域视野（一横）</text>
  <rect x="556" y="164" width="36" height="150" rx="6" fill="#059669"/>
  <rect x="668" y="164" width="36" height="150" rx="6" fill="#059669"/>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#047852">深度①</text>
  <text x="600" y="218" text-anchor="middle" font-size="11" fill="#047852">技术纵深</text>
  <text x="712" y="200" text-anchor="middle" font-size="11" fill="#047852">深度②</text>
  <text x="712" y="218" text-anchor="middle" font-size="11" fill="#047852">业务/管理</text>
  <text x="630" y="336" text-anchor="middle" font-size="11" fill="#475569">第二深度从痛点里长出来，两竖互为备份</text>

  <!-- bottom advice -->
  <rect x="60" y="330" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="76" y="352" font-size="12" font-weight="700" fill="#1E293B">选题三问：</text>
  <text x="76" y="374" font-size="12" fill="#475569">①日常痛点反复出现吗？②团队能给你练手场景吗？③钻透后别人绕不开你吗？——三问皆"是"，就是值得扎根的方向。追热点不如挖痛点。</text>
</svg>
