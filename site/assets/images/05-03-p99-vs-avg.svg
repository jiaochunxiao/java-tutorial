<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">为什么看 P99 不看平均值：长尾分布的"迷惑性"</text>

  <!-- axis -->
  <line x1="90" y1="300" x2="780" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <line x1="90" y1="300" x2="90" y2="80" stroke="#94A3B8" stroke-width="2"/>
  <text x="700" y="322" text-anchor="middle" font-size="12" fill="#64748B">响应时间 RT →</text>
  <text x="76" y="90" font-size="12" fill="#64748B" transform="rotate(-90 76 90)"></text>
  <g font-size="11" fill="#94A3B8" text-anchor="middle">
    <text x="90" y="318">10ms</text><text x="235" y="318">50ms</text><text x="380" y="318">100ms</text><text x="525" y="318">500ms</text><text x="670" y="318">1s</text><text x="770" y="318">2s</text>
  </g>

  <!-- histogram bars: most fast -->
  <g fill="#93C5FD" stroke="#2563EB" stroke-width="1">
    <rect x="95"  y="220" width="28" height="80" />
    <rect x="127" y="180" width="28" height="120"/>
    <rect x="159" y="150" width="28" height="150"/>
    <rect x="191" y="170" width="28" height="130"/>
    <rect x="223" y="220" width="28" height="80" />
    <rect x="255" y="250" width="28" height="50" />
    <rect x="287" y="266" width="28" height="34" />
  </g>
  <!-- tail bars -->
  <g fill="#FCA5A5" stroke="#DC2626" stroke-width="1">
    <rect x="319" y="278" width="28" height="22" />
    <rect x="351" y="284" width="28" height="16" />
    <rect x="383" y="288" width="28" height="12" />
    <rect x="415" y="291" width="28" height="9"  />
    <rect x="530" y="293" width="28" height="7"  />
    <rect x="600" y="294" width="28" height="6"  />
    <rect x="680" y="295" width="28" height="5"  />
    <rect x="740" y="296" width="28" height="4"  />
  </g>
  <text x="330" y="120" font-size="13" font-weight="700" fill="#2563EB">99 个请求：10~100ms（又快又稳）</text>
  <text x="560" y="150" font-size="13" font-weight="700" fill="#B91C1C">1 个请求：卡到 1~2 秒</text>
  <text x="560" y="172" font-size="11" fill="#991B1B">高峰期慢请求堆积线程 → 放大成雪崩</text>

  <!-- avg marker -->
  <line x1="240" y1="90" x2="240" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="150" y="66" width="190" height="30" rx="8" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="245" y="86" text-anchor="middle" font-size="12" fill="#1D4ED8" font-weight="700">平均值 ≈ 54ms（被稀释）</text>

  <!-- p99 marker -->
  <line x1="640" y1="90" x2="640" y2="300" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="560" y="66" width="170" height="30" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
  <text x="645" y="86" text-anchor="middle" font-size="12" fill="#B91C1C" font-weight="700">P99 ≈ 1.2s（真实的痛）</text>

  <rect x="90" y="332" width="700" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="106" y="354" font-size="12" fill="#475569">经验法则：优化盯 P95/P99 与错误率，平均值用来感受大盘。压测报告只给平均值的，</text>
  <text x="106" y="376" font-size="12" fill="#475569">直接要分位数曲线——那 1% 的慢请求，往往就是线上事故的火种。</text>
</svg>
