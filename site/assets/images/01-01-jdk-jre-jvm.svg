<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="430" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">JDK ⊃ JRE ⊃ JVM：套娃式包含关系</text>

  <!-- JDK outer -->
  <rect x="60" y="66" width="520" height="330" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="84" y="98" font-size="18" font-weight="700" fill="#1D4ED8">JDK · 开发工具包（给开发者）</text>
  <g font-size="13" fill="#1E40AF">
    <rect x="84" y="118" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="159" y="138" text-anchor="middle">javac 编译器</text>
    <rect x="248" y="118" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="323" y="138" text-anchor="middle">jdb 调试器</text>
    <rect x="412" y="118" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="487" y="138" text-anchor="middle">javadoc / jmap ...</text>
  </g>
  <text x="84" y="172" font-size="12" fill="#1E40AF">↑ 开发专用的工具箱，写代码必装</text>

  <!-- JRE middle -->
  <rect x="100" y="190" width="440" height="180" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="124" y="220" font-size="16" font-weight="700" fill="#B45309">JRE · 运行环境（给用户）</text>
  <g font-size="13" fill="#92400E">
    <rect x="124" y="238" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="214" y="258" text-anchor="middle">核心类库（java.lang 等）</text>
    <rect x="322" y="238" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="412" y="258" text-anchor="middle">启动工具（java 命令）</text>
  </g>
  <text x="124" y="292" font-size="12" fill="#92400E">↑ 跑别人写好的 Java 程序，有它就够</text>

  <!-- JVM inner -->
  <rect x="140" y="306" width="360" height="46" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">JVM · 虚拟机：真正执行字节码的引擎</text>

  <!-- right notes -->
  <g font-size="13" fill="#334155">
    <rect x="620" y="80" width="212" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="634" y="106" font-weight="700" fill="#1E293B">✍️ 要写代码</text>
    <text x="634" y="130">装 JDK（含 JRE/JVM）</text>
    <text x="634" y="152" fill="#64748B">javac + java 都能用</text>

    <rect x="620" y="190" width="212" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="634" y="216" font-weight="700" fill="#1E293B">🏃 只跑程序</text>
    <text x="634" y="240">JRE 即可（含 JVM）</text>
    <text x="634" y="262" fill="#64748B">例：只玩 Minecraft 的电脑</text>

    <rect x="620" y="300" width="212" height="96" rx="10" fill="#FDF2F8" stroke="#F472B6"/>
    <text x="634" y="326" font-weight="700" fill="#BE185D">📌 版本提示</text>
    <text x="634" y="350">JDK 11 起不再单独发布</text>
    <text x="634" y="372">JRE，装 JDK 即可</text>
  </g>
  <text x="430" y="416" text-anchor="middle" font-size="13" fill="#64748B">记住一句话：JDK 里套着 JRE，JRE 里套着 JVM，外层多出来的都是"给特定人群的工具"</text>
</svg>
