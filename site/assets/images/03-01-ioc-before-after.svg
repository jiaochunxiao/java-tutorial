<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#F8FAFC"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">IoC 前后对比：从"自己拉关系"到"中央配送"</text>

  <!-- before -->
  <rect x="46" y="70" width="370" height="320" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="231" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">没有 IoC：自己 new，层层组装</text>
  <g text-anchor="middle" font-size="12">
    <rect x="136" y="116" width="190" height="40" rx="9" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="231" y="141" fill="#991B1B">OrderService</text>
    <line x1="150" y1="176" x2="108" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="112" y="196" text-anchor="middle" font-size="10" fill="#64748B">自己 new ↓</text>
    <rect x="46" y="216" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="106" y="239" fill="#991B1B">new ConfigLoader</text>
    <line x1="312" y1="176" x2="352" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="296" y="216" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="356" y="239" fill="#991B1B">new SmsChannel</text>
    <line x1="231" y1="176" x2="231" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="146" y="272" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="231" y="295" fill="#991B1B">new StockService(...)</text>
    <text x="231" y="342" text-anchor="middle" font-size="11" fill="#B91C1C">依赖焊死：换实现 = 全场改码</text>
    <text x="231" y="364" text-anchor="middle" font-size="11" fill="#B91C1C">没法单测：一 new 就真连数据库</text>
  </g>

  <!-- after -->
  <rect x="446" y="70" width="370" height="320" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="631" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">有 IoC：容器装配，依赖送上门</text>
  <rect x="500" y="116" width="262" height="70" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="631" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">IoC 容器（大管家）</text>
  <text x="631" y="162" text-anchor="middle" font-size="11" fill="#475569">扫描 @Component → 反射实例化 → 注入</text>
  <text x="631" y="180" text-anchor="middle" font-size="11" fill="#475569">单例池 singletonObjects 存成品</text>
  <g text-anchor="middle" font-size="12">
    <rect x="470" y="230" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="545" y="254" fill="#065F46">OrderService（只声明）</text>
    <rect x="660" y="230" width="130" height="38" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="725" y="254" fill="#065F46">StockService 成品</text>
    <line x1="656" y1="246" x2="624" y2="246" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="640" y="234" text-anchor="middle" font-size="10" fill="#047857">构造器注入 ↑</text>
    <text x="631" y="300" text-anchor="middle" font-size="12" fill="#475569">换实现：改一个注解/@Bean 即可</text>
    <text x="631" y="322" text-anchor="middle" font-size="12" fill="#475569">可测试：new OrderService(mock) 直接跑</text>
    <text x="631" y="352" text-anchor="middle" font-size="11" fill="#047857">"控制权"从业务代码反转给了容器</text>
    <text x="631" y="372" text-anchor="middle" font-size="11" fill="#047857">业务代码只管声明"我需要什么"</text>
  </g>

  <rect x="46" y="400" width="770" height="24" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="62" y="417" font-size="12" fill="#1E40AF">IoC 是思想（控制权反转），DI 是手段（构造器/Setter 注入）。推荐构造器注入：final、依赖必填、脱离容器也能 new。</text>
</svg>
